<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rollywood</title>
  <meta name="description" content="Rollywood – tilt your phone to roll the marble into the hole. A free marble game for Android.">
  <link rel="icon" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #12143a; --text: #f4efe4; --muted: #c4c0d8; --accent: #ffb13b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      background: radial-gradient(circle at 50% 30%, #3e43a3, #1b1d4e 55%, #0b0c24); color: var(--text);
      font: 17px/1.6 Nunito, system-ui, sans-serif; }
    main { max-width: 560px; padding: 40px 16px; }
    img { width: 160px; height: 160px; border-radius: 36px; box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
    h1 { font-family: "Baloo 2", system-ui, sans-serif; font-size: 56px; margin: 24px 0 0; line-height: 1;
      background: linear-gradient(#fff3c4, #ffb13b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); margin: 8px 0 28px; }
    .play { display: inline-block; padding: 14px 28px; border-radius: 999px; background: #4ed88c; color: #0e2a1b;
      font: 800 18px "Baloo 2", system-ui, sans-serif; text-decoration: none; box-shadow: 0 6px 0 #1c8049; }
    nav { margin-top: 36px; font-size: 15px; }
    nav a { color: var(--accent); margin: 0 10px; }
    footer { margin-top: 24px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<main>
  <img src="icon.png" alt="Rollywood app icon">
  <h1>ROLLYWOOD</h1>
  <p>Tilt your phone. Roll the marble. Sink the shot!</p>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.hieudv.rollywood">Get it on Google Play</a>
  <nav>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="mailto:duonghieu4299@gmail.com">Contact</a>
  </nav>
  <footer>© 2026 Dương Hiếu</footer>
</main>
</body>
</html>
